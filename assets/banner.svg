<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="MERN-Stack-Courier-and-Parcel-Management-System — book it, track it, deliver it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="90" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="110" cy="300" r="70" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="980" cy="300" r="40" fill="#FFFFFF" opacity="0.10"/>
  <text x="60" y="90" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF">Courier &amp; Parcel Manager</text>
  <text x="60" y="135" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FED7AA">Book it. Track it. Deliver it — in real time.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="170" width="180" height="54" rx="27" fill="#FFFFFF"/>
    <text x="150" y="205" font-size="21" font-weight="bold" fill="#9A3412" text-anchor="middle">Book a pickup</text>
    <rect x="260" y="170" width="170" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="345" y="205" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Live tracking</text>
    <rect x="450" y="170" width="170" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="535" y="205" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CSV reports</text>
  </g>
  <g>
    <rect x="700" y="150" width="440" height="130" rx="16" fill="url(#card)"/>
    <text x="730" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#9A3412">Booked → Assigned → Out for delivery</text>
    <text x="730" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#9A3412">→ Delivered</text>
    <text x="730" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444">Admins, customers and agents —</text>
    <text x="730" y="272" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#444444">each sees their own view, live.</text>
  </g>
  <text x="60" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#FDBA74">MERN stack  •  React + Node + MongoDB  •  Socket.IO live updates  •  Google Maps</text>
</svg>
